global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: tp-devops-web
    metrics_path: /metrics
    static_configs:
      # nom du service Compose, pas localhost (on est dans le réseau Docker)
      - targets: ["web:5000"]
