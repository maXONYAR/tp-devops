server {
    listen 80;
    server_name _;

    # DNS interne de Docker : la résolution se fait à chaque requête, nginx démarre même
    # si la couleur ciblée n'existe pas encore
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Définit $active_upstream ; ce fichier est réécrit par deploy.sh à chaque bascule
    include /etc/nginx/active/upstream.conf;

    location / {
        proxy_pass $active_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}
