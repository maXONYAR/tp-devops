name: CD

on:
  # Se déclenche quand la CI d'un push sur main se termine
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible
        type: choice
        options: [production]
        default: production
        required: true

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    # CI verte sur un push main, ou lancement manuel
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Calculer nom d'image et tags
        id: meta
        env:
          SHA_FULL: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          {
            echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}"
            echo "sha=${SHA_FULL}"
            echo "short_sha=${SHA_FULL::7}"
            echo "semver=$(cat VERSION).${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build et push (latest, SHA court, semver)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.semver }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.semver }}
            GIT_SHA=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
      SHA: ${{ needs.build-and-push.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy blue/green
        id: deploy
        run: IMAGE_NAME="${IMAGE}" bash deploy/deploy.sh "${SHA}"
      - name: Vérification post-déploiement (3 tentatives)
        run: |
          for i in 1 2 3; do
            if curl --fail --silent --show-error --max-time 5 "http://localhost:${NGINX_PORT:-8080}/health"; then
              echo && echo "Healthcheck OK (tentative $i)"
              exit 0
            fi
            echo "Tentative $i/3 échouée"
            sleep 10
          done
          exit 1
      - name: Rollback vers le SHA précédent
        # Le déploiement a réussi (bascule faite) mais la vérification finale a échoué
        if: failure() && steps.deploy.outcome == 'success'
        run: IMAGE_NAME="${IMAGE}" bash deploy/rollback.sh
